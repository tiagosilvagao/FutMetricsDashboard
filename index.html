      topo.classList.remove('trocando'); void topo.offsetWidth; topo.classList.add('trocando');
    },
    destruir(){ el.innerHTML=''; }
  };
}


function goleiraCard(canvas, opts){
  const o   = Object.assign({ vento:0.6, grama:1 }, opts||{});
  const ctx = canvas.getContext('2d');

  /* --- medidas oficiais da baliza (m) + profundidade da rede ------------- */
  const GW=7.32, GH=2.44, HW=GW/2, DEEP=1.95;
  const EYE=o.olho||[-3.05,1.70,7.55], TGT=o.alvo||[0.05,1.00,-0.55];
  const WDX=0.93, WDZ=0.37;                       // direção do vento no plano do chão

  /* --- câmera fixa: base ortonormal + projeção pinhole ------------------- */
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm=a=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
  const FWD=norm(sub(TGT,EYE)), RGT=norm(cross(FWD,[0,1,0])), UPV=cross(RGT,FWD);
  let F=1, CX=0, CY=0, W=0, H=0, DPR=1;

  function proj(x,y,z){
    const dx=x-EYE[0], dy=y-EYE[1], dz=z-EYE[2];
    const d = dx*FWD[0]+dy*FWD[1]+dz*FWD[2];      // profundidade
    const s = F/(d>0.15?d:0.15);
    return [ CX + (dx*RGT[0]+dy*RGT[1]+dz*RGT[2])*s,
             CY - (dx*UPV[0]+dy*UPV[1]+dz*UPV[2])*s, d ];
  }

  /* --- vento: soma de senos + rajada lenta ------------------------------- */
  function vento(x,z,t){
    const s = 0.55*Math.sin(0.55*x + 0.30*z - 1.45*t)
            + 0.30*Math.sin(0.90*x - 0.42*z - 2.30*t + 1.7)
            + 0.15*Math.sin(1.70*x + 0.60*z - 3.40*t + 4.1);
    const rajada = 0.58 + 0.42*Math.sin(t*0.41)*Math.sin(t*0.26+1.1);
    return s*rajada;
  }

  /* --- perfil da rede: [z/DEEP, y/GH] do travessão até a barra do chão --- */
  const PROF=[[0,1],[0.30,0.982],[0.52,0.885],[0.70,0.700],[0.85,0.440],[0.95,0.200],[1,0]];
  function perfil(v){
    const f=Math.min(Math.max(v,0),1)*(PROF.length-1), i=Math.min(Math.floor(f),PROF.length-2), k=f-i;
    return [ -DEEP*(PROF[i][0]+(PROF[i+1][0]-PROF[i][0])*k),
              GH  *(PROF[i][1]+(PROF[i+1][1]-PROF[i][1])*k) ];
  }

  /* --- grama: sorteada em espaço de TELA e projetada de volta no chão ---
     As lâminas são agrupadas por cor+espessura: o desenho vira ~20 stroke()
     por quadro em vez de um por lâmina.                                    */
  const TONS=['#16351d','#1c4023','#234c29','#2a5931','#33693a'], LARG=[0.8,1.4,2.2,3.2];
  let grupos=[], horY=0;
  function noChao(sx, sy){                                   // raio da tela → plano y=0
    const a=(sx-CX)/F, b=-(sy-CY)/F;
    const dy = FWD[1] + a*RGT[1] + b*UPV[1];
    if(dy > -1e-4) return null;                              // acima do horizonte
    const k = -EYE[1]/dy;
    if(k > 27) return null;                                  // longe demais para render lâmina
    return [ EYE[0] + k*(FWD[0]+a*RGT[0]+b*UPV[0]), EYE[2] + k*(FWD[2]+a*RGT[2]+b*UPV[2]), k ];
  }
  function semear(){
    horY = proj(0,0,-900)[1];
    grupos = TONS.flatMap(c => LARG.map(l => ({ cor:c, lw:l*DPR, atras:[], frente:[] })));
    const y0 = Math.max(horY+2, 0), faixa = (H+14) - y0;
    if(faixa <= 0) return;
    const alvo = Math.round(Math.min(2200, (W+20)*faixa/(52*DPR*DPR)) * o.grama);
    let seed=20260804, feitas=0, tent=0;
    const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    while(feitas < alvo && tent++ < alvo*8){
      const g = noChao(-10 + rnd()*(W+20), y0 + rnd()*faixa);
      if(!g) continue;
      feitas++;
      const k = g[2];
      const lam = {
        x:g[0], z:g[1],
        h:(0.040 + rnd()*0.055)*Math.min(1.85, 1 + 0.036*k),
        rig: 0.55 + rnd()*0.85,
        fase: rnd()*6.28,
        pend: (rnd()-0.5)*0.55                               // inclinação de repouso
      };
      let ti = Math.round(rnd()*4);
      if(k > 11) ti = Math.max(0, ti-1);                     // ao longe, tons mais fechados
      const px = (0.011 + rnd()*0.010)*F/k;                  // espessura projetada
      const li = px<1.1 ? 0 : px<1.8 ? 1 : px<2.8 ? 2 : 3;
      const gr = grupos[ti*LARG.length + li];
      (lam.z < -0.05 ? gr.atras : gr.frente).push(lam);
    }
  }

  /* --- gramado: faixas de corte convergindo no horizonte ----------------- */
  function chao(){
    const hor = proj(0,0,-900)[1];
    const g = ctx.createLinearGradient(0,hor,0,H);
    g.addColorStop(0,'#152d1c'); g.addColorStop(0.32,'#1d4325'); g.addColorStop(0.70,'#20492a'); g.addColorStop(1,'#22502d');
    ctx.fillStyle=g; ctx.fillRect(0,hor,W,H-hor);
    for(let i=-8;i<8;i++){
      if(i%2) continue;
      const a=proj(i*1.85,0,-60), b=proj(i*1.85+1.85,0,-60), c=proj(i*1.85+1.85,0,5.4), d=proj(i*1.85,0,5.4);
      ctx.fillStyle='rgba(255,255,255,.022)';
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.closePath(); ctx.fill();
    }
    // linha de fundo
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=Math.max(1,1.6*DPR);
    const l0=proj(-11,0.005,0), l1=proj(11,0.005,0);
    ctx.beginPath(); ctx.moveTo(l0[0],l0[1]); ctx.lineTo(l1[0],l1[1]); ctx.stroke();
    // sombra suave sob a baliza
    const c=proj(0,0,-DEEP*0.45), r=(proj(HW+0.7,0,-DEEP*0.45)[0]-proj(-HW-0.7,0,-DEEP*0.45)[0])*0.5;
    const sg=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],r);
    sg.addColorStop(0,'rgba(0,0,0,.42)'); sg.addColorStop(0.6,'rgba(0,0,0,.18)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.translate(c[0],c[1]); ctx.scale(1,0.19); ctx.translate(-c[0],-c[1]);
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(c[0],c[1],r,0,6.2832); ctx.fill(); ctx.restore();
  }

  /* --- grama: curva quadrática por lâmina, ponta puxada pelo vento ------- */
  function grama(t, campo){
    ctx.lineCap='round';
    for(const g of grupos){
      const lista = g[campo];
      if(!lista.length) continue;
      ctx.strokeStyle = g.cor; ctx.lineWidth = g.lw;
      ctx.beginPath();
      for(const b of lista){
        const w  = vento(b.x, b.z, t + b.fase*0.05)*o.vento/b.rig;
        const dx = (WDX*w + b.pend)*b.h*0.85, dz = (WDZ*w + b.pend*0.4)*b.h*0.85;
        const hy = b.h*(0.98 - 0.22*Math.abs(w));
        const p0 = proj(b.x, 0, b.z);
        const p1 = proj(b.x+dx*0.30, hy*0.58, b.z+dz*0.30);
        const p2 = proj(b.x+dx, hy, b.z+dz);
        ctx.moveTo(p0[0], p0[1]);
        ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
      }
      ctx.stroke();
    }
  }

  /* --- rede: grades projetadas, deslocadas por um "bojo" × vento --------- */
  const NU=23, NV=13, SU=10, SV=9;
  const gridFundo=[], gridLat=[[],[]];
  function malha(t){
    const amp = 0.30*o.vento;
    for(let j=0;j<NV;j++){                                   // painel do fundo
      const v=j/(NV-1), pr=perfil(v);
      for(let i=0;i<NU;i++){
        const u=i/(NU-1), x=-HW+GW*u;
        const bojo = Math.sin(Math.PI*u)*Math.sin(Math.PI*Math.min(v*1.12,1));
        const w = vento(x, pr[0], t)*amp*bojo;
        gridFundo[j*NU+i] = proj(x + w*0.30, pr[1] + w*0.22, pr[0] + w*0.92);
      }
    }
    for(let s=0;s<2;s++){                                    // painéis laterais
      const sx = s? HW : -HW;
      for(let i=0;i<SU;i++){
        const v=i/(SU-1), pr=perfil(v);
        for(let j=0;j<SV;j++){
          const f=j/(SV-1), y=pr[1]*f;
          const bojo = Math.sin(Math.PI*v)*Math.sin(Math.PI*f);
          const w = vento(sx, pr[0], t)*amp*bojo*0.8;
          gridLat[s][i*SV+j] = proj(sx + w*(s?0.95:-0.95), y + w*0.10, pr[0] + w*0.20);
        }
      }
    }
  }
  function tracar(pts){
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();
  }
  function rede(){
    ctx.lineWidth = Math.max(0.6, 0.95*DPR);
    ctx.lineJoin='round';
    for(let s=0;s<2;s++){                                    // laterais primeiro (mais ao fundo)
      ctx.strokeStyle = s? 'rgba(226,240,232,.24)' : 'rgba(226,240,232,.32)';
      for(let i=0;i<SU;i++){ const c=[]; for(let j=0;j<SV;j++) c.push(gridLat[s][i*SV+j]); tracar(c); }
      for(let j=0;j<SV;j++){ const r=[]; for(let i=0;i<SU;i++) r.push(gridLat[s][i*SV+j]); tracar(r); }
    }
    ctx.strokeStyle='rgba(232,244,236,.38)';
    for(let i=0;i<NU;i++){ const c=[]; for(let j=0;j<NV;j++) c.push(gridFundo[j*NU+i]); tracar(c); }
    for(let j=0;j<NV;j++){ const r=[]; for(let i=0;i<NU;i++) r.push(gridFundo[j*NU+i]); tracar(r); }
  }

  /* --- estrutura: traves e barras, espessura por profundidade ------------ */
  function tubo(a, b, esp, cor, passos){
    ctx.strokeStyle=cor; ctx.lineCap='round';
    for(let k=0;k<passos;k++){
      const t0=k/passos, t1=(k+1)/passos;
      const p=proj(a[0]+(b[0]-a[0])*t0, a[1]+(b[1]-a[1])*t0, a[2]+(b[2]-a[2])*t0);
      const q=proj(a[0]+(b[0]-a[0])*t1, a[1]+(b[1]-a[1])*t1, a[2]+(b[2]-a[2])*t1);
      ctx.lineWidth = Math.max(1, esp*F/((p[2]+q[2])*0.5));
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
    }
  }
  function estrutura(){
    tubo([-HW,0.02,-DEEP],[ HW,0.02,-DEEP], 0.042,'rgba(214,228,220,.45)', 8);   // barra de fundo
    tubo([-HW,0.02,0],[-HW,0.02,-DEEP], 0.05,'rgba(214,228,220,.45)', 5);
    tubo([ HW,0.02,0],[ HW,0.02,-DEEP], 0.05,'rgba(214,228,220,.45)', 5);
    tubo([-HW,0,0],[-HW,GH,0], 0.12,'#eef4f0', 3);                               // traves
    tubo([ HW,0,0],[ HW,GH,0], 0.12,'#dfe8e3', 3);
    tubo([-HW,GH,0],[ HW,GH,0], 0.12,'#eef4f0', 14);                             // travessão
    tubo([-HW,GH+0.035,0],[HW,GH+0.035,0], 0.03,'rgba(255,255,255,.55)', 14);    // brilho superior
  }

  /* --- laço ------------------------------------------------------------- */
  function medir(){
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = Math.max(2, Math.round(r.width*DPR)); H = Math.max(2, Math.round(r.height*DPR));
    if(canvas.width!==W || canvas.height!==H){
      canvas.width=W; canvas.height=H;
      F=1; CX=0; CY=0;                                   // mede a baliza com F unitário
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const q of [[-HW,0,0],[HW,0,0],[-HW,GH,0],[HW,GH,0],[-HW,0,-DEEP],[HW,0,-DEEP]]){
        const s=proj(q[0],q[1],q[2]);
        if(s[0]<x0)x0=s[0]; if(s[0]>x1)x1=s[0]; if(s[1]<y0)y0=s[1]; if(s[1]>y1)y1=s[1];
      }
      F  = Math.min(W*0.88/(x1-x0), H*0.60/(y1-y0));         // ocupa 88% da largura / 60% da altura
      CX = W*0.5 - (x0+x1)*0.5*F;
      CY = H*0.08 - y0*F;                                    // topo do travessão a 8% do card
      semear();
      if(o.aoRedimensionar) o.aoRedimensionar();             // reposiciona os pontos por cima
    }
  }
  function desenhar(t){
    medir();
    ctx.clearRect(0,0,W,H);
    chao();
    grama(t, 'atras');           // grama atrás da linha de fundo
    malha(t); rede(); estrutura();
    grama(t, 'frente');          // grama à frente cobre a base das traves
  }

  let raf=0, t0=null, visivel=true;
  const parado = o.estatico || matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ms){
    if(t0===null) t0=ms;
    desenhar((ms-t0)/1000);
    raf = visivel && !parado ? requestAnimationFrame(frame) : 0;
  }
  if(parado){ requestAnimationFrame(()=>desenhar(3.2)); }
  else{
    new IntersectionObserver(es=>{                            // pausa fora da tela
      visivel = es[0].isIntersecting;
      if(visivel && !raf) raf = requestAnimationFrame(frame);
    },{threshold:0.01}).observe(canvas);
  }
  addEventListener('resize', ()=>{ if(!raf) requestAnimationFrame(()=>desenhar(3.2)); });
  return {
    /* ponto do plano da BOCA do gol em px CSS: x 0..1 (esq→dir), y 0..1 (chão→travessão) */
    boca(x,y){ const q=proj(-HW+GW*x, GH*y, 0); return [q[0]/DPR, q[1]/DPR]; },
    caixa(){ return [W/DPR, H/DPR]; },
    destruir(){ cancelAnimationFrame(raf); raf=0; visivel=false; }
  };
}


/* ===== JS: render — mapa de presença ===== */
const CAMPO = { el: null, api: null };
function renderPresence(p){
  const grid = presenceData(p);                        // [col, linha, valor 0..1]
  const thirds = [0, 0, 0], lanes = [0, 0, 0];
  let total = 0;
  grid.forEach(([i, j, v]) => {
    thirds[2 - Math.min(2, Math.floor(j / HEAT_ROWS * 3))] += v;   // linha 0 = ataque
    lanes[Math.min(2, Math.floor(i / HEAT_COLS * 3))] += v; total += v;
  });
  const pct = thirds.map(v => Math.round(v / total * 100));
  pct[1] = 100 - pct[0] - pct[2];
  const T = ['Terço defensivo', 'Meio-campo', 'Terço ofensivo'], L = ['corredor esq.', 'corredor central', 'corredor dir.'];
  const top = thirds.indexOf(Math.max(...thirds)), lane = lanes.indexOf(Math.max(...lanes));

  $('#presence').innerHTML = `

/* ===== JS: render — cobranças de pênalti ===== */
const GOAL = { box: null, svg: null, api: null, shots: [] };
const SVG_NS = 'http://www.w3.org/2000/svg';
function drawGoalOverlay(){
  if (!GOAL.api) return;
  const [W, H] = GOAL.api.caixa();
  if (!W || !H) return;
  const B = (x, y) => GOAL.api.boca(x, y).map(v => v.toFixed(1));
  const shots = GOAL.shots;
  const parts = [];
  for (let row = 0; row < 2; row++) for (let col = 0; col < 3; col++){
    const x0 = col / 3 + .015, x1 = (col + 1) / 3 - .015;
    const yTop = row ? .48 : .96, yBot = row ? .04 : .52;
    parts.push(`<polygon class="zone" points="${[B(x0, yTop), B(x1, yTop), B(x1, yBot), B(x0, yBot)].map(q => q.join(',')).join(' ')}"/>`);
    const inZone = shots.filter(s => s.col === col && s.row === row);
    if (inZone.length){
      const [tx, ty] = B(x0 + .025, yTop - .16);
      parts.push(`<text class="zcount" x="${tx}" y="${ty}">${inZone.filter(s => s.result === 'gol').length}/${inZone.length}</text>`);
    }
  }
  const LABEL = {gol: 'Gol', def: 'Defendido', fora: 'Fora / trave'};
  const COLS = ['esquerdo', 'centro', 'direito'], ROWS = ['alto', 'baixo'];
  shots.forEach((s, k) => {
    let x = (s.col + .25 + s.jx * .5) / 3;
    let y = s.row === 0 ? 1 - (.3 + s.jy * .45) * .5 : .5 - (.3 + s.jy * .45) * .5;
    if (s.result === 'fora'){
      if (s.row === 0 || s.col === 1) y = 1.1 + s.jy * .14;              // por cima do travessão
      else x = s.col === 0 ? -.04 - s.jx * .04 : 1.04 + s.jx * .04;       // ao lado da trave
    }
    const [cx, cy] = B(x, y);
    parts.push(`<circle class="shot ${s.result}" cx="${cx}" cy="${cy}" r="5.5"><title>Cobrança ${k + 1}: ${LABEL[s.result]} · canto ${COLS[s.col]} ${ROWS[s.row]}</title></circle>`);
  });
  if (!shots.length){ const [cx, cy] = B(.5, .5); parts.push(`<text class="empty-txt" x="${cx}" y="${cy}" text-anchor="middle">Nenhuma cobrança na temporada</text>`); }
  parts.push(`<text class="side-txt" x="6" y="${H - 6}">ESQ.</text>`,
             `<text class="side-txt" x="${W / 2}" y="${H - 6}" text-anchor="middle">VISÃO DO COBRADOR</text>`,
             `<text class="side-txt" x="${W - 6}" y="${H - 6}" text-anchor="end">DIR.</text>`);
  GOAL.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  GOAL.svg.innerHTML = parts.join('');
}
function renderPenalties(p){
  const shots = penaltyData(p);
  const scored = shots.filter(s => s.result === 'gol').length;
  const saved = shots.filter(s => s.result === 'def').length;

/* ===== JS: carta holográfica ===== */
const POS_SHORT = {GK:'GOL', CB:'ZAG', LB:'LE', RB:'LD', CM:'MC', LW:'PE', RW:'PD', FW:'ATA'};
const FLAGS = {'Brasil':'🇧🇷', 'Colômbia':'🇨🇴', 'Equador':'🇪🇨', 'Uruguai':'🇺🇾', 'Espanha':'🇪🇸', 'Venezuela':'🇻🇪', 'Argentina':'🇦🇷', 'Portugal':'🇵🇹'};
const HOLO_RULE = dynRule('#holo');
const holoTier = ovr => ovr >= 85 ? ['gold', 'Dourada · OVR 85+'] : ovr >= 75 ? ['emerald', 'Esmeralda · OVR 75–84'] : ['silver', 'Prata · OVR abaixo de 75'];

/* mola: o ponteiro define um alvo e a carta persegue com aceleração e atrito (inércia) */
function makeSpring(initial, settings, onFrame){
  const keys = Object.keys(initial), value = {...initial}, target = {...initial}, vel = {};
  keys.forEach(k => vel[k] = 0);
  let cfg = {...settings}, raf = null;
  function frame(){
    let moving = false;
    for (const k of keys){
      const delta = target[k] - value[k];
      vel[k] += cfg.stiffness * delta - cfg.damping * vel[k];
      value[k] += vel[k];
      if (Math.abs(delta) > .01 || Math.abs(vel[k]) > .01) moving = true;
    }
    onFrame(value);
    raf = moving ? requestAnimationFrame(frame) : null;
  }
  return { set(next, nextCfg){ if (nextCfg) cfg = {...nextCfg}; Object.assign(target, next); if (raf === null) raf = requestAnimationFrame(frame); } };
}
const SPRING_INTERACT = { stiffness: .066, damping: .25 };
const SPRING_SNAP = { stiffness: .01, damping: .06 };
function holoInteraction(card, HOLO_RULE){
  const float = card.closest('.holo-float');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r3 = v => Math.round(v * 1000) / 1000, clamp = (v, a = 0, b = 100) => Math.min(Math.max(v, a), b);
  const adjust = (v, a, b, c, d) => r3(c + (d - c) * (v - a) / (b - a));
  let snapTimer = null;
  const spring = makeSpring({rx: 0, ry: 0, gx: 50, gy: 50, o: 0, bx: 50, by: 50}, SPRING_INTERACT, v => {
    const fc = clamp(Math.hypot(v.gy - 50, v.gx - 50) / 50, 0, 1);
    const st = HOLO_RULE.style;
    st.setProperty('--pointer-x', `${r3(v.gx)}%`);
    st.setProperty('--pointer-y', `${r3(v.gy)}%`);
    st.setProperty('--pointer-from-center', r3(fc));
    st.setProperty('--pointer-from-top', r3(v.gy / 100));
    st.setProperty('--pointer-from-left', r3(v.gx / 100));
    st.setProperty('--card-opacity', clamp(r3(v.o), 0, 1));
    st.setProperty('--rotate-x', `${r3(v.rx)}deg`);
    st.setProperty('--rotate-y', `${r3(v.ry)}deg`);
    st.setProperty('--background-x', `${r3(v.bx)}%`);
    st.setProperty('--background-y', `${r3(v.by)}%`);
  });
  function interact(e){
    clearTimeout(snapTimer); float.classList.add('interacting');
    const pt = e.touches ? e.touches[0] : e, rect = card.getBoundingClientRect();
    const px = clamp(r3(100 / rect.width * (pt.clientX - rect.left))), py = clamp(r3(100 / rect.height * (pt.clientY - rect.top)));
    spring.set({ rx: r3(-(px - 50) / 3.5), ry: r3((py - 50) / 3.5), gx: px, gy: py, o: 1,
                 bx: adjust(px, 0, 100, 37, 63), by: adjust(py, 0, 100, 33, 67) }, SPRING_INTERACT);
  }
  function interactEnd(){
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { float.classList.remove('interacting'); spring.set({rx: 0, ry: 0, gx: 50, gy: 50, o: 0, bx: 50, by: 50}, SPRING_SNAP); }, 500);
  }
  card.addEventListener('pointermove', interact);
  card.addEventListener('pointerleave', interactEnd);
  card.addEventListener('touchmove', interact, {passive: true});
  card.addEventListener('touchend', interactEnd);
  card.addEventListener('touchcancel', interactEnd);
}
holoInteraction($('#holo'), HOLO_RULE);

function fillHolo(p, t = {card: $('#holo'), inner: $('#holo-inner'), tier: $('#holo-tier'), rule: HOLO_RULE}){
  const ovr = Math.round(p.rating * 10);
  const [tier, tierLabel] = holoTier(ovr);
  t.card.className = `holo-card tier-${tier} ${clubClass(p.club_name)}`;
  t.rule.style.setProperty('--hue', `${(p.player_id * 47) % 120 - 60}deg`);   // matiz própria de cada jogador
  const short = p.player_name.split(' ').length > 1 ? p.player_name.split(' ').slice(-2).join(' ') : p.player_name;
  const stat = (v, k) => `<div class="holo-stat"><span class="v">${v}</span><span class="k">${k}</span></div>`;
  t.inner.innerHTML = `
    <div class="holo-top">
      <div class="holo-ovr"><div class="ovr">${ovr}</div><div class="pos">${POS_SHORT[p.position]}</div><div class="flag">${FLAGS[p.nationality] || ''}</div></div>
      <div class="holo-crest"><span class="ini">${initials(p.club_name)}</span>${img(crestPath(p.club_name))}</div>
    </div>
    <div class="holo-portrait">
      <div class="holo-watermark"><span class="ini">${initials(p.club_name)}</span>${img(crestPath(p.club_name))}</div>
      <div class="holo-glow"></div>
      <div class="holo-photo"><span class="ini holo-initials">${initials(p.player_name)}</span>${img(cardPath(p))}</div>
    </div>
    <div class="holo-banner"><span class="nm">${short.toUpperCase()}</span><span class="cl">${p.club_name} · ${POSITION_LABELS[p.position]}</span></div>
    <div class="holo-stats">
      ${stat(p.goals, 'GOL')}${stat(fmt(p.shot_accuracy_pct, 0) + '%', 'CHU')}${stat(p.tackles, 'DES')}
      ${stat(p.clearances, 'COR')}${stat(fmt(p.pass_accuracy_pct, 0) + '%', 'PAS')}${stat(p.assists, 'ASS')}
    </div>`;
  t.tier.textContent = `Carta ${tierLabel}`;

/* troca vertical estritamente sequencial: a carta atual desce até sair da tela e SÓ DEPOIS
   a próxima sobe de baixo — sem cross-fade nem sobreposição. Cliques rápidos não empilham
   animações: vale sempre o último jogador pedido. */
const HOLO = { shown: null, target: null, busy: false };
async function swapHolo(id){
  HOLO.target = id;
  if (HOLO.busy) return;
  HOLO.busy = true;
  const el = $('.holo-swap');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  while (HOLO.shown !== HOLO.target){
    const rect = el.getBoundingClientRect();
    const dist = Math.max(window.innerHeight - rect.top, rect.height) + 60;   // até passar da borda inferior da tela
    let out = null;
    if (HOLO.shown !== null && !still){
      out = el.animate([{transform: 'translateY(0)'}, {transform: `translateY(${dist}px)`}],
                       {duration: 420, easing: 'cubic-bezier(.55,0,.8,.25)', fill: 'forwards'});
      await out.finished;
    }
    const next = HOLO.target;          // lido só agora: vale o último jogador pedido durante a descida
    fillHolo(BY_ID[next]);
    HOLO.shown = next;
    if (!still){
      const inn = el.animate([{transform: `translateY(${dist}px)`}, {transform: 'translateY(0)'}],
                             {duration: 600, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards'});
      if (out) out.cancel();
      await inn.finished;
      inn.cancel();
    }
  }
  HOLO.busy = false;
}

/* ----- animação de pontos: ao trocar de jogador, os pontos dos gráficos deslizam até a nova posição ----- */
const TWEENS = {};
function tweenPts(key, from, to, apply, ms = 650){
  if (TWEENS[key]) cancelAnimationFrame(TWEENS[key].raf);
  const st = TWEENS[key] = { cur: to, raf: 0 };
  if (!from || matchMedia('(prefers-reduced-motion: reduce)').matches){ apply(to); return; }
  const t0 = performance.now(), ease = t => 1 - (1 - t) ** 3;
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    st.cur = to.map((p, i) => p.map((v, j) => from[i][j] + (v - from[i][j]) * k));
    apply(st.cur);
    if (t < 1) st.raf = requestAnimationFrame(step);
  };
  apply(from); st.raf = requestAnimationFrame(step);
}
// histórico com tamanhos diferentes: pontos novos saem do último ponto antigo
const padFrom = (prev, to) => prev && prev.length ? to.map((_, i) => prev[Math.min(i, prev.length - 1)]) : null;
function applyMarket(svg, P){
  const base = +svg.dataset.base, f = v => v.toFixed(1);
  const line = P.map((p, i) => (i ? 'L' : 'M') + f(p[0]) + ' ' + f(p[1])).join(' ');
  svg.querySelector('.line').setAttribute('d', line);
  svg.querySelector('.area').setAttribute('d', `${line} L${f(P.at(-1)[0])} ${base} L${f(P[0][0])} ${base} Z`);
  svg.querySelectorAll('.mark').forEach((c, i) => { c.setAttribute('cx', f(P[i][0])); c.setAttribute('cy', f(P[i][1])); });
  svg.querySelectorAll('.val').forEach((t, i) => { t.setAttribute('x', f(P[i][0])); t.setAttribute('y', f(P[i][1] - 9)); });
  svg.querySelectorAll('.tick').forEach((t, i) => t.setAttribute('x', f(P[i][0])));
}
function applyRadar(svg, ratios){
  const W = 334, cx = W / 2, cy = 126, R = 82, n = ratios.length;
  const ang = i => (-90 + i * 360 / n) * Math.PI / 180;
  const pt = i => [cx + Math.cos(ang(i)) * R * Math.max(ratios[i], .03), cy + Math.sin(ang(i)) * R * Math.max(ratios[i], .03)];
  svg.querySelector('.shape').setAttribute('points', ratios.map((_, i) => pt(i).map(v => v.toFixed(1)).join(',')).join(' '));
  svg.querySelectorAll('.vtx').forEach((c, i) => { const [x, y] = pt(i); c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); });
}

/* ----- tooltip do gráfico de valor de mercado ----- */
function mvTip(hit, on){
  const svg = hit.ownerSVGElement, tip = svg.querySelector('.mv-tip'), mark = svg.querySelectorAll('.mark')[+hit.dataset.i];
  if (mark) mark.classList.toggle('hover', on);
  tip.classList.toggle('on', on);
  if (!on || !mark) return;
  const x = +mark.getAttribute('cx'), y = +mark.getAttribute('cy'), W = +svg.dataset.w, bw = 96, bh = 38;
  const tx = Math.min(Math.max(x - bw / 2, 2), W - bw - 2), ty = y - bh - 12 < 0 ? y + 12 : y - bh - 12;
  tip.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)})`);
  tip.querySelector('.tip-p').textContent = hit.dataset.label;
  tip.querySelector('.tip-v').textContent = `${hit.dataset.v} mi`;
}
document.addEventListener('pointerover', e => { const h = e.target.closest && e.target.closest('.chart .hit'); if (h) mvTip(h, true); });
document.addEventListener('pointerout', e => { const h = e.target.closest && e.target.closest('.chart .hit'); if (h) mvTip(h, false); });

/* ----- filtros: duas listas suspensas de seleção múltipla (posição e clube) -----
   Marcar itens só altera um rascunho; o ranking muda quando se clica em "Filtrar" dentro da lista.

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const GROUP_LABELS = {ataque: 'Ataque', meio: 'Meio-campo', defesa: 'Defesa', goleiro: 'Goleiro'};
const FILTERS = {
  pos: {
    key: 'groups', width: 250, crest: false,
    opts: Object.keys(POS_GROUPS).map(g => ({id: g, label: GROUP_LABELS[g], n: PLAYERS.filter(pl => POS_GROUPS[g].includes(pl.position)).length}))
  },

};
for (const [id, f] of Object.entries(FILTERS)){ f.id = id; f.draft = new Set(); f.rule = dynRule(`#${id}-menu`); }

function buildMenu(f){
  $(`#${f.id}-list`).innerHTML = f.opts.map(o => `
    <button class="dd-item ${f.crest ? '' : 'plain'}" role="menuitemcheckbox" aria-checked="false" data-dd="${f.id}" data-opt="${o.id}">

      <span class="n">${o.n}</span>

}
/* resultado que o filtro daria com o rascunho atual (mostrado no botão "Filtrar") */
function previewCount(f){
  const groups = f.key === 'groups' ? f.draft : state.groups, clubs = f.key === 'clubs' ? f.draft : state.clubs;
  return currentView(groups, clubs).length;
}
function renderMenu(f){
  document.querySelectorAll(`[data-dd="${f.id}"]`).forEach(b => b.setAttribute('aria-checked', f.draft.has(b.dataset.opt)));
  $(`#${f.id}-apply`).textContent = `Filtrar (${previewCount(f)})`;
}
function renderFilters(){
  for (const f of Object.values(FILTERS)){
    const n = state[f.key].size, cnt = $(`#${f.id}-count`);
    cnt.hidden = !n; cnt.textContent = n;

function placeMenu(f){

function closeMenus(){

}
function openMenu(f){

  renderMenu(f); placeMenu(f);
  $(`#${f.id}-menu`).hidden = false; $(`#${f.id}-btn`).setAttribute('aria-expanded', 'true');
}
function applyMenu(f){

  closeMenus(); renderFilters(); renderRanking(true);
}
function toggleIn(set, v){ set.has(v) ? set.delete(v) : set.add(v); }
document.addEventListener('click', (e) => {
  const opt = e.target.closest('[data-dd]');
  if (opt){ const f = FILTERS[opt.dataset.dd]; toggleIn(f.draft, opt.dataset.opt); renderMenu(f); return; }
  const ap = e.target.closest('[data-dd-apply]');
  if (ap){ applyMenu(FILTERS[ap.dataset.ddApply]); return; }
  const cl = e.target.closest('[data-dd-clear]');
  if (cl){ const f = FILTERS[cl.dataset.ddClear]; f.draft.clear(); applyMenu(f); return; }
  const btn = e.target.closest('#pos-btn, #club-btn');
  if (btn){ const f = FILTERS[btn.id.replace('-btn', '')]; $(`#${f.id}-menu`).hidden ? openMenu(f) : closeMenus(); return; }
  if (e.target.closest('#filter-clear')){ state.groups.clear(); state.clubs.clear(); closeMenus(); renderFilters(); renderRanking(true); return; }
  if (!e.target.closest('.dropdown')) closeMenus();
});
addEventListener('resize', () => { for (const f of Object.values(FILTERS)) if (!$(`#${f.id}-menu`).hidden) placeMenu(f); });
Object.values(FILTERS).forEach(buildMenu);
renderFilters();

/* ===== JS: comparação entre dois jogadores =====
   Fluxo: botão "Comparar" → clicar no rival na lista atual → os cards do dash somem e entra o painel central
   (radar sobreposto + métricas) com a carta de cada jogador ao lado; a do rival sobe com slide up.
   O mesmo botão encerra a comparação e os cards voltam. */
const CMP = { phase: 'off', a: null, b: null, busy: false };   // phase: off | pick (escolhendo o rival) | on
const CMP_ROWS = [   // métricas abaixo do radar: [chave, rótulo, casas decimais, unidade]
  ['rating', 'Rating geral', 1, ''],
  ['shots_total', 'Chutes totais', 0, ''], ['shots_on_target', 'Chutes no alvo', 0, ''], ['shot_accuracy_pct', 'Precisão de chute', 1, '%'],
  ['passes_total', 'Passes totais', 0, ''], ['passes_completed', 'Passes certos', 0, ''], ['pass_accuracy_pct', 'Precisão de passe', 1, '%']
];
const holoShell = k => `<div class="holo-swap"><div class="holo-wrap"><div class="holo-float"><div class="holo-card" id="holo-${k}">
  <div class="holo-foil"></div><div class="holo-shine"></div><div class="holo-glare"></div><div class="holo-inner" id="holo-${k}-inner"></div><div class="holo-edge"></div>
  </div></div></div><div class="holo-shadow" aria-hidden="true"></div><span class="label holo-tier" id="holo-${k}-tier"></span></div>`;
const CMP_HOLO = {};
for (const k of ['a', 'b']){
  $(`#cmp-${k}-col`).innerHTML = holoShell(k);
  CMP_HOLO[k] = { card: $(`#holo-${k}`), inner: $(`#holo-${k}-inner`), tier: $(`#holo-${k}-tier`), rule: dynRule(`#holo-${k}`) };
  holoInteraction(CMP_HOLO[k].card, CMP_HOLO[k].rule);
}
const cmpCls = (x, y) => x > y ? 'win' : x < y ? 'lose' : '';

/* radar com os dois jogadores sobrepostos (mesma escala do radar individual: maior valor do campeonato) */
function radarOverlay(a, b){
  const W = 334, H = 262, cx = W / 2, cy = 126, R = 82, n = RADAR_STATS.length;
  const ang = i => (-90 + i * 360 / n) * Math.PI / 180;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  const poly = r => RADAR_STATS.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ');
  const ratios = p => RADAR_STATS.map(([k]) => Math.min(1, p[k] / radarMax(k)));
  const shape = r => r.map((v, i) => pt(i, R * Math.max(v, .03)).map(c => c.toFixed(1)).join(',')).join(' ');
  const dots = (r, cls, p) => r.map((v, i) => { const [x, y] = pt(i, R * Math.max(v, .03));
    return `<circle class="vtx ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2"><title>${p.player_name} · ${RADAR_STATS[i][1]}: ${fmt(p[RADAR_STATS[i][0]])}</title></circle>`; }).join('');
  const ra = ratios(a), rb = ratios(b);
  const labels = RADAR_STATS.map(([k, name], i) => {
    const [x, y] = pt(i, R + 26), c = Math.cos(ang(i));
    const anchor = c > .3 ? 'start' : c < -.3 ? 'end' : 'middle';
    const dy = Math.sin(ang(i)) < -.9 ? -6 : Math.sin(ang(i)) > .9 ? 4 : -2;
    return `<text class="rl" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${name}</text>
      <text class="rv" x="${x.toFixed(1)}" y="${(y + dy + 15).toFixed(1)}" text-anchor="${anchor}"><tspan class="a ${cmpCls(a[k], b[k])}">${fmt(a[k])}</tspan><tspan class="sep"> · </tspan><tspan class="b ${cmpCls(b[k], a[k])}">${fmt(b[k])}</tspan></text>`;
  }).join('');
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar sobreposto de ${a.player_name} e ${b.player_name}">
    ${[.25, .5, .75, 1].map(r => `<polygon class="ring ${r === 1 ? 'outer' : ''}" points="${poly(R * r)}"/>`).join('')}
    ${RADAR_STATS.map((_, i) => { const [x, y] = pt(i, R); return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('')}
    <polygon class="shape b" points="${shape(rb)}"/><polygon class="shape" points="${shape(ra)}"/>
    ${dots(rb, 'b', b)}${dots(ra, 'a', a)}
    ${labels}
  </svg>`;
}

function renderCompare(a, b){
  let wa = 0, wb = 0;
  [...RADAR_STATS, ...CMP_ROWS].forEach(([k]) => { if (a[k] > b[k]) wa++; else if (b[k] > a[k]) wb++; });
  const side = (v, o, cls, top, d, u) => `<div class="cmp-side ${cls} ${cmpCls(v, o)}">
      <span class="cmp-v">${v > o ? '<em class="cmp-mark">▲</em>' : ''}${fmt(v, d)}${u}</span>
      <span class="bar"><i class="w${Math.round(v / top * 20) * 5}"></i></span></div>`;
  const rows = CMP_ROWS.map(([k, label, d, u]) => {
    const top = Math.max(a[k], b[k]) || 1;
    return `<div class="cmp-row">${side(a[k], b[k], 'a', top, d, u)}<span class="label cmp-k">${label}</span>${side(b[k], a[k], 'b', top, d, u)}</div>`;
  }).join('');
  const id = (p, cls) => `<div class="cmp-id ${cls}"><span class="nm">${p.player_name}</span><span class="muted">${p.club_name} · ${POSITION_LABELS[p.position]}</span></div>`;
  $('#cmp-panel').innerHTML = `
    <div class="card-head"><span class="label">Comparação · Perfil de desempenho</span><span class="chip gold">${RADAR_STATS.length + CMP_ROWS.length} métricas</span></div>
    <div class="card-body scroll">
      <div class="cmp-vs">${id(a, 'a')}
        <div class="cmp-score"><span class="sc"><span class="a">${wa}</span><span class="x">×</span><span class="b">${wb}</span></span><span class="label">Métricas lideradas</span></div>
        ${id(b, 'b')}</div>
      <div class="section"><span class="label">Atributos sobrepostos</span>${radarOverlay(a, b)}<span class="label caption">Escala: maior valor do campeonato · o menor valor de cada eixo aparece esmaecido</span></div>
      <div class="section"><span class="label">Demais métricas</span>${rows}</div>
    </div>`;
}

function setCmpPhase(phase){
  CMP.phase = phase;
  const app = $('.app'), btn = $('#cmp-btn'), hint = $('#cmp-hint');
  app.classList.toggle('picking', phase === 'pick');
  btn.setAttribute('aria-pressed', phase !== 'off');
  btn.classList.toggle('on', phase !== 'off');
  $('#cmp-label').textContent = phase === 'off' ? 'Comparar' : phase === 'pick' ? 'Cancelar' : 'Sair da comparação';
  hint.hidden = phase === 'off';
  if (phase === 'pick') hint.textContent = `Clique, na lista, no jogador para comparar com ${BY_ID[CMP.a].player_name}`;
  if (phase === 'on') hint.textContent = `${BY_ID[CMP.a].player_name} × ${BY_ID[CMP.b].player_name}`;
}
const cmpStill = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
/* slides: cada card sai/entra pela borda mais próxima — laterais pelos lados, centro por baixo */
const offLeft  = el => `translateX(${-(el.getBoundingClientRect().right + 40)}px)`;
const offRight = el => `translateX(${innerWidth - el.getBoundingClientRect().left + 40}px)`;
const offDown  = el => `translateY(${Math.max(innerHeight - el.getBoundingClientRect().top, 0) + 60}px)`;
const SLIDE_OUT = { duration: 460, easing: 'cubic-bezier(.55,0,.8,.25)', fill: 'forwards' };
const SLIDE_IN  = { duration: 720, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' };
const slideOut = moves => moves.map(([el, to]) => el.animate([{transform: 'none'}, {transform: to}], SLIDE_OUT));
const slideIn  = moves => moves.map(([el, from, delay = 0]) => el.animate([{transform: from}, {transform: 'none'}], {...SLIDE_IN, delay}));
const finished = anims => Promise.all(anims.map(a => a.finished));
const dashMoves = () => { const L = $('.side-l'), R = $('.side-r'), F = $('.field'); return [[L, offLeft(L)], [R, offRight(R)], [F, offDown(F)]]; };
const cmpMoves  = () => { const A = $('#cmp-a-col'), P = $('#cmp-panel'), B = $('#cmp-b-col'); return [[A, offLeft(A)], [P, offDown(P), 90], [B, offDown(B), 220]]; };

function pickRival(id){
  if (id === CMP.a || CMP.busy) return;       // não compara o jogador com ele mesmo
  openCompare(id);
}
async function openCompare(bid){
  CMP.busy = true; CMP.b = bid;
  const a = BY_ID[CMP.a], b = BY_ID[bid], app = $('.app');
  setCmpPhase('on'); closeMenus();
  renderCompare(a, b); fillHolo(a, CMP_HOLO.a); fillHolo(b, CMP_HOLO.b);
  if (cmpStill()){ app.classList.add('comparing'); $('#compare').hidden = false; CMP.busy = false; return; }
  document.body.classList.add('sliding');
  const out = slideOut(dashMoves()); await finished(out);
  app.classList.add('comparing'); $('#compare').hidden = false;
  const inn = slideIn(cmpMoves()); out.forEach(x => x.cancel());   // mesmo quadro: sem piscar
  await finished(inn); inn.forEach(x => x.cancel());
  document.body.classList.remove('sliding');
  CMP.busy = false;
}
async function closeCompare(){
  CMP.busy = true;
  const cmp = $('#compare'), app = $('.app');
  if (cmpStill()){ cmp.hidden = true; app.classList.remove('comparing'); setCmpPhase('off'); CMP.busy = false; return; }
  document.body.classList.add('sliding');
  const out = slideOut(cmpMoves().map(([el, to]) => [el, to])); await finished(out);
  cmp.hidden = true; app.classList.remove('comparing'); setCmpPhase('off');
  const inn = slideIn(dashMoves().map(([el, from], i) => [el, from, [0, 90, 160][i]])); out.forEach(x => x.cancel());
  await finished(inn); inn.forEach(x => x.cancel());
  document.body.classList.remove('sliding');
  CMP.busy = false;
}
$('#cmp-btn').addEventListener('click', () => {
  if (CMP.busy) return;
  if (CMP.phase === 'off'){ CMP.a = state.selected; closeMenus(); setCmpPhase('pick'); }
  else if (CMP.phase === 'pick') setCmpPhase('off');
  else closeCompare();
});

if (matchMedia('(prefers-reduced-motion: reduce)').matches){ const v = $('#bg-video'); v.removeAttribute('autoplay'); v.pause(); }

renderRanking();
select(state.selected);
</script>
</body>
